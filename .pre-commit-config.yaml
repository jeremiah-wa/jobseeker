repos:
  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        files: ^backend/
      # Run the formatter
      - id: ruff-format
        files: ^backend/

  # Mypy - Python type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app --ignore-missing-imports
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Frontend linting
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: pnpm -C frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: pnpm -C frontend run format:check
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false
      - id: tsc
        name: TypeScript
        entry: pnpm -C frontend run typecheck
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
