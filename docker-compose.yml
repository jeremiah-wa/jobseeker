services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: jobseeker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobseeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-jobseeker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobseeker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jobseeker-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobseeker}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-jobseeker}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - backend_uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jobseeker-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Adminer - Database UI (optional, for development)
  adminer:
    image: adminer:latest
    container_name: jobseeker-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  backend_uploads:
